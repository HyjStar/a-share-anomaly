name: Bootstrap repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          set -e
          test -f a-share-anomaly-github.zip
          rm -rf _bootstrap
          mkdir -p _bootstrap
          unzip -q a-share-anomaly-github.zip -d _bootstrap
          test -f _bootstrap/a-share-anomaly/run.py
          test -f _bootstrap/a-share-anomaly/.github/workflows/daily.yml
          cp -a _bootstrap/a-share-anomaly/. .
          rm -rf _bootstrap
          rm -f a-share-anomaly-github.zip
          rm -f .github/workflows/bootstrap.yml
          rm -f github-bootstrap.yml
          ls -la
          ls -la .github/workflows

      - name: Commit extracted project
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: bootstrap A股异动监测系统"
            git push
          fi
