name: Bootstrap and first scan

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-and-scan.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          set -e
          test -f a-share-anomaly-github.zip
          rm -rf _bootstrap
          mkdir -p _bootstrap
          unzip -q a-share-anomaly-github.zip -d _bootstrap
          test -f _bootstrap/a-share-anomaly/run.py
          test -f _bootstrap/a-share-anomaly/.github/workflows/daily.yml
          cp -a _bootstrap/a-share-anomaly/. .
          rm -rf _bootstrap
          rm -f a-share-anomaly-github.zip
          rm -f .github/workflows/bootstrap.yml
          rm -f github-bootstrap.yml
          ls -la
          ls -la .github/workflows

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run first real scan
        run: python run.py scan

      - name: Commit project and first scan
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: bootstrap project and first scan"
            git push
          fi
