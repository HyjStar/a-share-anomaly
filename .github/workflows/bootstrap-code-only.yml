name: Bootstrap code only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-code-only.yml

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract code and disable Actions scan
        run: |
          set -e
          test -f a-share-anomaly-github.zip
          rm -rf _bootstrap
          mkdir -p _bootstrap
          unzip -q a-share-anomaly-github.zip -d _bootstrap
          test -f _bootstrap/a-share-anomaly/run.py
          cp -a _bootstrap/a-share-anomaly/. .
          rm -rf _bootstrap
          rm -f a-share-anomaly-github.zip
          rm -f .github/workflows/bootstrap.yml
          rm -f .github/workflows/bootstrap-and-scan.yml
          rm -f github-bootstrap.yml
          # 行情抓取改由国内 VPS 执行，避免 GitHub 海外 runner 访问东财失败。
          rm -f .github/workflows/daily.yml
          ls -la
          ls -la .github/workflows

      - name: Commit extracted code
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: add project code for VPS-driven scans"
            git push
          fi
